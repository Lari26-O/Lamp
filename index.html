<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lamp — Learn & Remember the Bible</title>
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A free, accessible app in English, Français, Português and Español to read, understand and remember the Bible: maps, timeline, memory verses with spaced repetition, quizzes, notes & tags, videos and a free AI study helper.">
  <meta name="theme-color" content="#f8f5ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lamp">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply saved look before first paint (avoids a flash).
    try {
      const s = JSON.parse(localStorage.getItem('lamp:settings') || '{}');
      const r = document.documentElement;
      if (s.theme && s.theme !== 'system') r.dataset.theme = s.theme;
      if (s.fontSize) r.style.setProperty('--read-size', s.fontSize + 'px');
      if (s.lineHeight) r.style.setProperty('--read-lh', s.lineHeight);
      if (s.font) r.dataset.font = s.font;
      if (s.reduceMotion) r.dataset.motion = 'reduce';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-in">
      <img src="icons/icon.svg" alt="" width="104" height="104">
      <div class="splash-name">Lamp</div>
      <div class="splash-tag">Psalm 119:105</div>
    </div>
  </div>
  <style>
    #splash { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #fff3e3, #f8f5ef 60%); transition: opacity .45s ease, visibility .45s; }
    @media (prefers-color-scheme: dark) { #splash { background: radial-gradient(circle at 50% 40%, #3a2516, #14120f 65%); } #splash .splash-name { color: #f0e9de; } }
    #splash.hide { opacity: 0; visibility: hidden; }
    .splash-in { text-align: center; animation: splashUp .6s ease both; }
    .splash-in img { border-radius: 26px; box-shadow: 0 16px 40px rgba(124, 47, 13, .35); }
    .splash-name { font: 600 2.2rem Literata, Georgia, serif; color: #2a1f16; margin-top: 14px; letter-spacing: .01em; }
    .splash-tag { font: 600 .8rem system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #a3471b; margin-top: 4px; }
    @keyframes splashUp { from { opacity: 0; transform: translateY(10px) scale(.96); } }
    @media (prefers-reduced-motion: reduce) { .splash-in { animation: none; } }
  </style>
  <a class="skip" href="#view">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sidenav">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#/home" aria-label="Lamp home">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <span>Lamp</span>
    </a>
    <form class="gosearch" id="goSearch" role="search">
      <label class="sr-only" for="goInput">Go to a passage or search words</label>
      <input id="goInput" type="search" placeholder="John 3:16, Psalm 23, or “love”…" autocomplete="off" enterkeyhint="go">
    </form>
    <a class="streak-chip" id="streakChip" href="#/learn"></a>
    <select id="langSel" class="lang-sel"></select>
    <a class="avatar" id="avatar" href="#/account"></a>
    <button class="kids-exit" id="kidsExit" hidden>Grown-ups</button>
    <button class="kids-back" id="kidsBack" hidden></button>
  </header>

  <nav class="sidenav" id="sidenav" aria-label="Main"></nav>
  <div class="scrim" id="scrim" hidden></div>

  <main id="view" tabindex="-1"></main>

  <nav class="bottomnav" id="bottomnav" aria-label="Quick"></nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>

  <noscript><p style="padding:2rem">Lamp needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
